services:
  backend:
    image: ghcr.io/zodiac15/flavordex-backend:latest
    container_name: flavordex-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./flavordex.db
      CORS_ORIGINS: http://frontend:3000,http://localhost:3000
    volumes:
      - ./backend:/app/backend
    working_dir: /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: ghcr.io/zodiac15/flavordex-frontend:latest
    container_name: flavordex-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
